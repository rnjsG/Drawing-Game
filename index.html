<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>캐치 드로잉 게임</title>
  
  <!-- Firebase SDK (CDN) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    #game-container { width: 95%; max-width: 900px; height: 90vh; max-height: 800px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); position: relative; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #4a90e2; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header-info { display: flex; align-items: center; gap: 10px; }
    .room-badge { background: rgba(255, 255, 255, 0.2); padding: 4px 8px; border-radius: 4px; font-size: 14px; font-weight: bold; }
    .menu-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
    
    .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box { background: white; padding: 25px; border-radius: 8px; text-align: center; width: 80%; max-width: 320px; }
    .modal-box button { margin: 8px; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
    
    /* 5초 전 카운트다운 오버레이 */
    #start-countdown-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 90; display: none; }
    #start-countdown-num { font-size: 96px; font-weight: bold; color: #f1c40f; margin-top: 10px; }

    .btn-danger { background: #e74c3c; color: white; }
    .btn-secondary { background: #95a5a6; color: white; }
    .btn-warning { background: #f39c12; color: white; }
    .btn-success { background: #2ecc71; color: white; }
    
    .screen { display: none; flex: 1; flex-direction: column; padding: 20px; align-items: center; justify-content: center; width: 100%; overflow-y: auto; }
    .screen.active { display: flex; }
    
    .login-box { text-align: center; width: 100%; max-width: 380px; }
    .login-box input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center; }
    .login-box input#join-code-input { text-transform: uppercase; }
    .divider { margin: 15px 0; border-bottom: 1px solid #ddd; position: relative; }
    .divider span { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: white; padding: 0 10px; color: #888; font-size: 12px; }
    .join-code-group { display: flex; gap: 8px; margin-top: 8px; }
    
    .lobby-layout { display: flex; width: 100%; height: 100%; gap: 20px; }
    .user-list-panel { width: 35%; border-right: 1px solid #eee; padding-right: 15px; overflow-y: auto; }
    .lobby-main-panel { width: 65%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .code-display-box { background: #eef5fc; border: 2px dashed #4a90e2; padding: 15px; border-radius: 8px; margin-bottom: 20px; width: 100%; max-width: 300px; }
    .code-display-box span { font-size: 24px; font-weight: bold; color: #4a90e2; letter-spacing: 2px; }
    .user-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f8f9fa; border-radius: 6px; margin-bottom: 8px; }
    .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; color: white; font-weight: bold; }
    .badge-ready { background: #2ecc71; }
    .badge-wait { background: #e67e22; }
    .badge-submitted { background: #3498db; }
    
    .game-layout { display: flex; width: 100%; height: 100%; gap: 15px; }
    .game-sidebar { width: 30%; border-right: 1px solid #eee; padding-right: 10px; }
    .game-main { width: 70%; display: flex; flex-direction: column; align-items: center; }
    .game-header { display: flex; justify-content: space-between; width: 100%; margin-bottom: 10px; font-weight: bold; font-size: 18px; }
    
    /* 타이머 5초 이하 경고 스타일 */
    .timer-warning { color: #e74c3c !important; animation: blink 0.5s infinite alternate; font-size: 22px; font-weight: bold; }
    @keyframes blink { from { opacity: 1; } to { opacity: 0.3; } }

    .keyword { font-size: 22px; color: #e74c3c; margin-bottom: 10px; font-weight: bold; }
    #canvas { border: 2px solid #333; border-radius: 8px; background: white; cursor: crosshair; touch-action: none; }
    .controls { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; width: 100%; margin-top: 15px; max-height: 450px; overflow-y: auto; padding: 10px; }
    .gallery-item { border: 2px solid #ddd; border-radius: 8px; padding: 12px; text-align: center; background: #fff; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .gallery-item:hover { transform: translateY(-3px); border-color: #4a90e2; }
    .gallery-item.voted { border-color: #2ecc71; background-color: #eafaf1; }
    .gallery-item img { width: 100%; height: 130px; object-fit: contain; border: 1px solid #eee; border-radius: 4px; background: white; }
    .vote-count { margin-top: 5px; font-weight: bold; color: #e74c3c; }

    .btn { padding: 10px 15px; border: none; background: #4a90e2; color: white; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; }
    .btn:disabled { background: #ccc !important; cursor: not-allowed; }
  </style>
</head>
<body>

<div id="game-container">
  <header>
    <div class="header-info">
      <div id="room-info">캐치 드로잉</div>
      <div id="room-code-badge" class="room-badge" style="display:none;">코드: <span id="header-code">-</span></div>
    </div>
    <button class="menu-btn" onclick="toggleMenu(true)">☰</button>
  </header>

  <!-- 게임 시작 전 카운트다운 레이어 -->
  <div id="start-countdown-overlay">
    <h2>잠시 후 게임이 시작됩니다!</h2>
    <div id="start-countdown-num">5</div>
  </div>

  <div class="modal-overlay" id="menu-modal">
    <div class="modal-box">
      <h3>게임 메뉴</h3><br>
      <button class="btn btn-secondary" onclick="toggleMenu(false)">계속하기</button>
      <button class="btn btn-danger" onclick="leaveGame()">게임 나가기</button>
    </div>
  </div>

  <div class="modal-overlay" id="alert-modal">
    <div class="modal-box">
      <p id="alert-msg">알림 메시지</p><br>
      <button class="btn" onclick="closeAlert()">확인</button>
    </div>
  </div>

  <!-- 1. 로그인 스크린 -->
  <div class="screen active" id="login-screen">
    <div class="login-box">
      <h2 style="margin-bottom: 15px;">캐치 드로잉 시작하기</h2>
      <input type="text" id="nickname-input" placeholder="닉네임 입력 (최대 8자)" maxlength="8">
      
      <button class="btn btn-success" style="width: 100%; margin-top: 10px;" onclick="createRoom('SOLO')">혼자서 하기 (즉시 시작)</button>
      <button class="btn" style="width: 100%; margin-top: 8px;" id="create-btn" onclick="createRoom('MULTI')">새 방 만들기 (방 코드 생성)</button>
      
      <div class="divider"><span>또는 상대방 방에 참여하기</span></div>

      <div class="join-code-group">
        <input type="text" id="join-code-input" placeholder="방 코드 6자리" maxlength="6" oninput="this.value = this.value.toUpperCase()">
        <button class="btn btn-warning" style="white-space: nowrap;" id="join-btn" onclick="joinByCode()">코드 입력 후 참여</button>
      </div>
    </div>
  </div>

  <!-- 2. 대기실 화면 -->
  <div class="screen" id="lobby-screen">
    <div class="lobby-layout">
      <div class="user-list-panel">
        <h3>참여자 (<span id="user-count">0</span>/8)</h3><br>
        <div id="lobby-user-list"></div>
      </div>
      <div class="lobby-main-panel">
        <div class="code-display-box">
          <div style="font-size:12px; color:#666; margin-bottom:5px;">같이 할 사람에게 코드를 알려주세요!</div>
          <span id="lobby-room-code">XXXXXX</span><br>
          <button class="btn btn-secondary" style="margin-top:10px; padding:4px 10px; font-size:12px;" onclick="copyRoomCode()">코드 복사</button>
        </div>
        <h3 id="ready-status-msg" style="margin-bottom: 20px; color: #e67e22;">버튼을 눌러 준비해주세요!</h3>
        <button class="btn" id="ready-btn" onclick="toggleReady()">준비 완료</button>
      </div>
    </div>
  </div>

  <!-- 3. 게임 화면 -->
  <div class="screen" id="game-screen">
    <div class="game-layout">
      <div class="game-sidebar">
        <h3>제출 현황</h3><br>
        <div id="game-user-list"></div>
      </div>

      <div class="game-main">
        <div class="game-header">
          <div>라운드: <span id="current-round">1</span> / 5</div>
          <div>남은 시간: <span id="timer">30</span>초</div>
        </div>
        <div class="keyword">제시어: <span id="word-display">???</span></div>
        <canvas id="canvas" width="400" height="300"></canvas>
        <div class="controls">
          <button class="btn btn-secondary" onclick="undoCanvas()">↩️ 실행 취소</button>
          <button class="btn btn-secondary" onclick="redoCanvas()">↪️ 다시 실행</button>
          <button class="btn btn-secondary" id="clear-btn" onclick="clearCanvas()">전체 지우기</button>
          <button class="btn" id="submit-draw-btn" onclick="submitDrawing(false)">그림 제출 완료</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 4. 결과 화면 -->
  <div class="screen" id="result-screen">
    <h2 id="result-title">그림을 보고 마음에 드는 작품에 투표하세요!</h2>
    <div style="font-size: 13px; color: #666; margin-top: 5px;">(본인 그림에는 투표할 수 없습니다)</div>
    <div class="gallery" id="gallery"></div>
    <div style="margin-top: 15px; display: flex; gap: 10px; align-items: center;">
      <button class="btn btn-success" id="next-round-btn" onclick="toggleReadyNextRound()">다음 라운드 준비 완료</button>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAtNrtS13po1dFnp2ghAUgl3oAFAiW_oRQ",
    authDomain: "catch-drawing-cd3ad.firebaseapp.com",
    databaseURL: "https://catch-drawing-cd3ad-default-rtdb.firebaseio.com",
    projectId: "catch-drawing-cd3ad",
    storageBucket: "catch-drawing-cd3ad.firebasestorage.app",
    messagingSenderId: "1050697457191",
    appId: "1:1050697457191:web:83f8577762c04a36b03802",
    measurementId: "G-HVFZ8LD7N6"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const TOTAL_ROUNDS = 5;
  const DRAW_TIME = 30;
  const WORDS = ["강아지", "피자", "에펠탑", "고양이", "자동차", "우주선", "사과", "바나나", "로봇", "비행기", "눈사람", "호랑이", "선풍기"];

  let myId = 'u_' + Math.random().toString(36).substr(2, 5);
  let myName = '';
  let gameMode = 'MULTI';
  let currentRoomCode = '';
  let isHost = false;
  let timerInterval = null;
  let hasVoted = false;
  let lastRoundHandled = 0;

  let gameState = {
    roomCode: '',
    hostId: '',
    users: {},
    status: 'LOBBY',
    startCountdown: 0,
    round: 1,
    word: '',
    timer: DRAW_TIME
  };

  function generateRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    return code;
  }

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function showAlert(msg) {
    document.getElementById('alert-msg').innerText = msg;
    document.getElementById('alert-modal').classList.add('active');
  }

  function closeAlert() { document.getElementById('alert-modal').classList.remove('active'); }
  function toggleMenu(show) { document.getElementById('menu-modal').classList.toggle('active', show); }

  function copyRoomCode() {
    if(!currentRoomCode) return;
    navigator.clipboard.writeText(currentRoomCode).then(() => showAlert('방 코드가 복사되었습니다: ' + currentRoomCode));
  }

  function updateUI() {
    const usersArr = Object.values(gameState.users || {});
    isHost = (gameState.hostId === myId);

    if (currentRoomCode && gameMode === 'MULTI') {
      document.getElementById('room-code-badge').style.display = 'block';
      document.getElementById('header-code').innerText = currentRoomCode;
      document.getElementById('lobby-room-code').innerText = currentRoomCode;
    }

    document.getElementById('user-count').innerText = usersArr.length;
    
    // 대기실 유저 목록
    const lobbyList = document.getElementById('lobby-user-list');
    lobbyList.innerHTML = '';
    usersArr.forEach(u => {
      const div = document.createElement('div');
      div.className = 'user-item';
      const isMe = u.id === myId ? '(나)' : '';
      const isHostTag = u.id === gameState.hostId ? '👑' : '';
      const badge = u.ready ? `<span class="badge badge-ready">준비 완료</span>` : `<span class="badge badge-wait">대기 중</span>`;
      div.innerHTML = `<span>${isHostTag} ${u.name} ${isMe}</span> ${badge}`;
      lobbyList.appendChild(div);
    });

    // 내 준비 상태 버튼 텍스트 변경
    const myUser = gameState.users[myId];
    const readyBtn = document.getElementById('ready-btn');
    if (myUser) {
      readyBtn.innerText = myUser.ready ? "준비 취소" : "준비 완료";
      readyBtn.className = myUser.ready ? "btn btn-secondary" : "btn btn-success";
    }

    // 게임 내 유저 제출 현황
    const gameUserList = document.getElementById('game-user-list');
    gameUserList.innerHTML = '';
    usersArr.forEach(u => {
      const div = document.createElement('div');
      div.className = 'user-item';
      const badge = u.submitted ? `<span class="badge badge-submitted">제출 완료</span>` : `<span class="badge badge-wait">그리는 중...</span>`;
      div.innerHTML = `<span>${u.name}</span> ${badge}`;
      gameUserList.appendChild(div);
    });

    // 타이머 UI 처리 (5초 이하 시 빨간색 깜빡임)
    const timerElem = document.getElementById('timer');
    timerElem.innerText = gameState.timer;
    if (gameState.timer <= 5 && gameState.status === 'PLAYING') {
      timerElem.classList.add('timer-warning');
    } else {
      timerElem.classList.remove('timer-warning');
    }

    // 시작 카운트다운 레이어 (5,4,3,2,1)
    const countdownOverlay = document.getElementById('start-countdown-overlay');
    if (gameState.startCountdown > 0) {
      countdownOverlay.style.display = 'flex';
      document.getElementById('start-countdown-num').innerText = gameState.startCountdown;
    } else {
      countdownOverlay.style.display = 'none';
    }

    // 화면 전환 및 라운드 변경 시 캔버스 초기화
    if (gameState.status === 'LOBBY') {
      if (myName) showScreen('lobby-screen');
    } else if (gameState.status === 'PLAYING') {
      showScreen('game-screen');
      document.getElementById('current-round').innerText = gameState.round;
      document.getElementById('word-display').innerText = gameState.word;

      // 새로운 라운드 진입 시 캔버스 깨끗이 초기화
      if (lastRoundHandled !== gameState.round) {
        lastRoundHandled = gameState.round;
        resetCanvasState();
      }
    } else if (gameState.status === 'ROUND_RESULT') {
      showScreen('result-screen');
      renderResultScreen();
    }
  }

  function listenToRoom(code) {
    db.ref('rooms/' + code).on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        gameState = data;
        updateUI();

        // 방장(Host)이 타이머 및 진행 제어
        if (isHost && gameMode === 'MULTI') {
          handleHostLogic();
        }
      }
    });
  }

  // 호스트 전용 게임 제어 로직
  function handleHostLogic() {
    const usersArr = Object.values(gameState.users || {});

    // 1. 대기실에서 전원 준비 완료 시 5초 카운트다운 시작
    if (gameState.status === 'LOBBY' && usersArr.length > 0 && usersArr.every(u => u.ready)) {
      if (gameState.startCountdown === 0 && !timerInterval) {
        let count = 5;
        db.ref('rooms/' + currentRoomCode).update({ startCountdown: count });
        
        timerInterval = setInterval(() => {
          count--;
          if (count > 0) {
            db.ref('rooms/' + currentRoomCode).update({ startCountdown: count });
          } else {
            clearInterval(timerInterval);
            timerInterval = null;
            startNewRound(1);
          }
        }, 1000);
      }
    }

    // 2. 게임 시작 시 타이머 카운트다운
    if (gameState.status === 'PLAYING' && !timerInterval) {
      timerInterval = setInterval(() => {
        let newTime = gameState.timer - 1;
        const currentUsers = Object.values(gameState.users || {});
        const allSubmitted = currentUsers.length > 0 && currentUsers.every(u => u.submitted);

        if (newTime <= 0 || allSubmitted) {
          clearInterval(timerInterval);
          timerInterval = null;

          // 제한 시간 경과 시 미제출 플레이어 자동 제출 처리
          if (newTime <= 0) {
            autoSubmitUnfinishedDrawings();
          }

          db.ref('rooms/' + currentRoomCode).update({
            status: 'ROUND_RESULT',
            timer: 0
          });
        } else {
          db.ref('rooms/' + currentRoomCode).update({ timer: newTime });
        }
      }, 1000);
    }

    // 3. 결과 화면에서 전원 다음 라운드 준비 완료 시 넘어가기
    if (gameState.status === 'ROUND_RESULT' && usersArr.length > 0 && usersArr.every(u => u.readyNext)) {
      if (!timerInterval) {
        if (gameState.round < TOTAL_ROUNDS) {
          startNewRound(gameState.round + 1);
        } else {
          showAlert('게임이 모두 종료되었습니다! 대기실로 이동합니다.');
          db.ref('rooms/' + currentRoomCode).update({
            status: 'LOBBY',
            startCountdown: 0,
            round: 1
          });
          resetUsersReady();
        }
      }
    }
  }

  // 제한시간 종료 시 자동으로 현재 그림 제출
  function autoSubmitUnfinishedDrawings() {
    const myUser = gameState.users[myId];
    if (myUser && !myUser.submitted) {
      submitDrawing(true);
    }
  }

  function startNewRound(roundNum) {
    const nextWord = WORDS[Math.floor(Math.random() * WORDS.length)];
    const updatedUsers = {};
    
    // 각 라운드마다 투표수(votes) 0으로 리셋하여 해당 라운드만 집계
    Object.keys(gameState.users || {}).forEach(uid => {
      updatedUsers[uid] = {
        ...gameState.users[uid],
        submitted: false,
        drawing: '',
        votes: 0,
        readyNext: false
      };
    });

    db.ref('rooms/' + currentRoomCode).update({
      status: 'PLAYING',
      startCountdown: 0,
      round: roundNum,
      word: nextWord,
      timer: DRAW_TIME,
      users: updatedUsers
    });
    hasVoted = false;
  }

  function resetUsersReady() {
    Object.keys(gameState.users || {}).forEach(uid => {
      db.ref('rooms/' + currentRoomCode + '/users/' + uid).update({
        ready: false,
        readyNext: false,
        submitted: false,
        votes: 0,
        drawing: ''
      });
    });
  }

  function createRoom(selectedMode) {
    const input = document.getElementById('nickname-input');
    const name = input.value.trim();
    if (!name) return showAlert('닉네임을 입력해주세요.');

    myName = name;
    gameMode = selectedMode;

    if (gameMode === 'SOLO') {
      currentRoomCode = 'SOLO';
      isHost = true;
      gameState = {
        roomCode: 'SOLO',
        hostId: myId,
        users: { [myId]: { id: myId, name: myName, ready: true, votes: 0, drawing: '', submitted: false } },
        status: 'PLAYING', round: 1, word: WORDS[0], timer: DRAW_TIME
      };
      updateUI();
    } else {
      currentRoomCode = generateRoomCode();
      isHost = true;
      const initialUsers = {};
      initialUsers[myId] = { id: myId, name: myName, ready: false, votes: 0, drawing: '', submitted: false };

      db.ref('rooms/' + currentRoomCode).set({
        roomCode: currentRoomCode,
        hostId: myId,
        users: initialUsers,
        status: 'LOBBY',
        startCountdown: 0,
        round: 1,
        word: WORDS[Math.floor(Math.random() * WORDS.length)],
        timer: DRAW_TIME
      }).then(() => {
        listenToRoom(currentRoomCode);
      });
    }
  }

  function joinByCode() {
    const nameInput = document.getElementById('nickname-input');
    const codeInput = document.getElementById('join-code-input');
    const name = nameInput.value.trim();
    const code = codeInput.value.trim().toUpperCase();

    if (!name) return showAlert('닉네임을 입력해주세요.');
    if (!code || code.length !== 6) return showAlert('6자리 방 코드를 입력하세요.');

    myName = name;
    gameMode = 'MULTI';
    currentRoomCode = code;

    db.ref('rooms/' + code).once('value', (snapshot) => {
      if (!snapshot.exists()) {
        showAlert('존재하지 않는 방 코드입니다.');
        return;
      }

      db.ref('rooms/' + code + '/users/' + myId).set({
        id: myId, name: myName, ready: false, votes: 0, drawing: '', submitted: false
      }).then(() => {
        listenToRoom(code);
      });
    });
  }

  function toggleReady() {
    if (gameMode === 'SOLO') return;
    const currentReady = gameState.users[myId]?.ready || false;
    db.ref('rooms/' + currentRoomCode + '/users/' + myId + '/ready').set(!currentReady);
  }

  function toggleReadyNextRound() {
    if (gameMode === 'SOLO') {
      gameState.round++;
      if (gameState.round > TOTAL_ROUNDS) {
        showAlert('게임이 완료되었습니다!');
        showScreen('login-screen');
      } else {
        gameState.status = 'PLAYING';
        gameState.timer = DRAW_TIME;
        gameState.word = WORDS[Math.floor(Math.random() * WORDS.length)];
        gameState.users[myId].votes = 0;
        resetCanvasState();
        updateUI();
      }
      return;
    }

    const currentReadyNext = gameState.users[myId]?.readyNext || false;
    db.ref('rooms/' + currentRoomCode + '/users/' + myId + '/readyNext').set(!currentReadyNext);
    
    const nextBtn = document.getElementById('next-round-btn');
    nextBtn.innerText = !currentReadyNext ? "대기 중..." : "다음 라운드 준비 완료";
  }

  function leaveGame() { location.reload(); }

  // Canvas 히스토리 (실행 취소/다시 실행) 로직
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;
  let undoStack = [];
  let redoStack = [];

  function resetCanvasState() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    undoStack = [];
    redoStack = [];
  }

  function saveState() {
    if (undoStack.length >= 20) undoStack.shift();
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    redoStack = [];
  }

  function undoCanvas() {
    if (undoStack.length > 0) {
      redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      const previousState = undoStack.pop();
      ctx.putImageData(previousState, 0, 0);
    }
  }

  function redoCanvas() {
    if (redoStack.length > 0) {
      undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      const nextState = redoStack.pop();
      ctx.putImageData(nextState, 0, 0);
    }
  }

  function initCanvas() {
    ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#000';
    
    // 마우스 이벤트
    canvas.addEventListener('mousedown', (e) => {
      saveState();
      isDrawing = true;
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    });
    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
    });
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mouseleave', () => isDrawing = false);

    // 모바일 터치 이벤트
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      saveState();
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      isDrawing = true;
      ctx.beginPath();
      ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
    });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
      ctx.stroke();
    });
    canvas.addEventListener('touchend', () => isDrawing = false);
  }

  function clearCanvas() { 
    saveState();
    ctx.clearRect(0, 0, canvas.width, canvas.height); 
  }

  function submitDrawing(isAuto = false) {
    const dataUrl = canvas.toDataURL();
    if (gameMode === 'MULTI') {
      db.ref('rooms/' + currentRoomCode + '/users/' + myId).update({
        drawing: dataUrl,
        submitted: true
      });
      if (!isAuto) showAlert('그림 제출이 완료되었습니다! 다른 플레이어를 기다립니다.');
    } else {
      gameState.users[myId].drawing = dataUrl;
      gameState.users[myId].submitted = true;
      gameState.status = 'ROUND_RESULT';
      updateUI();
    }
  }

  // 제출된 모든 그림 갤러리 출력 및 해당 라운드 표 집계
  function renderResultScreen() {
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';

    Object.values(gameState.users || {}).forEach(u => {
      if (u.drawing) {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        const voteCount = u.votes || 0;
        
        item.innerHTML = `
          <img src="${u.drawing}">
          <div style="margin-top:8px;"><b>${u.name}</b></div>
          <div class="vote-count">❤️ 이번 라운드: ${voteCount}표</div>
        `;

        item.onclick = () => {
          if (u.id === myId) return showAlert('본인 그림에는 투표할 수 없습니다!');
          if (hasVoted) return showAlert('이미 투표하셨습니다!');

          hasVoted = true;
          item.classList.add('voted');

          if (gameMode === 'MULTI') {
            db.ref('rooms/' + currentRoomCode + '/users/' + u.id + '/votes').set(voteCount + 1);
          } else {
            u.votes = voteCount + 1;
            renderResultScreen();
          }
          showAlert(`${u.name}님의 그림에 투표했습니다!`);
        };

        gallery.appendChild(item);
      }
    });
  }

  window.onload = () => { initCanvas(); };
</script>
</body>
</html>
