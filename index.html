<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>캐치 드로잉 게임</title>
  
  <!-- Firebase SDK (CDN) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    #game-container { width: 95%; max-width: 900px; height: 90vh; max-height: 800px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); position: relative; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #4a90e2; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header-info { display: flex; align-items: center; gap: 10px; }
    .room-badge { background: rgba(255, 255, 255, 0.2); padding: 4px 8px; border-radius: 4px; font-size: 14px; font-weight: bold; }
    .menu-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
    .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box { background: white; padding: 25px; border-radius: 8px; text-align: center; width: 80%; max-width: 320px; }
    .modal-box button { margin: 8px; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-secondary { background: #95a5a6; color: white; }
    .btn-warning { background: #f39c12; color: white; }
    .btn-success { background: #2ecc71; color: white; }
    .screen { display: none; flex: 1; flex-direction: column; padding: 20px; align-items: center; justify-content: center; width: 100%; overflow-y: auto; }
    .screen.active { display: flex; }
    .login-box { text-align: center; width: 100%; max-width: 380px; }
    .login-box input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center; }
    .login-box input#join-code-input { text-transform: uppercase; }
    .divider { margin: 15px 0; border-bottom: 1px solid #ddd; position: relative; }
    .divider span { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: white; padding: 0 10px; color: #888; font-size: 12px; }
    .join-code-group { display: flex; gap: 8px; margin-top: 8px; }
    .lobby-layout { display: flex; width: 100%; height: 100%; gap: 20px; }
    .user-list-panel { width: 35%; border-right: 1px solid #eee; padding-right: 15px; overflow-y: auto; }
    .lobby-main-panel { width: 65%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .code-display-box { background: #eef5fc; border: 2px dashed #4a90e2; padding: 15px; border-radius: 8px; margin-bottom: 20px; width: 100%; max-width: 300px; }
    .code-display-box span { font-size: 24px; font-weight: bold; color: #4a90e2; letter-spacing: 2px; }
    .user-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f8f9fa; border-radius: 6px; margin-bottom: 8px; }
    .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; color: white; font-weight: bold; }
    .badge-ready { background: #2ecc71; }
    .badge-wait { background: #e67e22; }
    .badge-submitted { background: #3498db; }
    .game-layout { display: flex; width: 100%; height: 100%; gap: 15px; }
    .game-sidebar { width: 30%; border-right: 1px solid #eee; padding-right: 10px; }
    .game-main { width: 70%; display: flex; flex-direction: column; align-items: center; }
    .game-header { display: flex; justify-content: space-between; width: 100%; margin-bottom: 10px; font-weight: bold; font-size: 18px; }
    .keyword { font-size: 22px; color: #e74c3c; margin-bottom: 10px; font-weight: bold; }
    #canvas { border: 2px solid #333; border-radius: 8px; background: white; cursor: crosshair; touch-action: none; }
    .controls { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; width: 100%; margin-top: 15px; }
    .gallery-item { border: 1px solid #ccc; border-radius: 8px; padding: 12px; text-align: center; background: #fff; }
    .gallery-item img { width: 100%; height: 130px; object-fit: contain; border: 1px solid #eee; border-radius: 4px; }
    .btn { padding: 10px 15px; border: none; background: #4a90e2; color: white; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; }
    .btn:disabled { background: #ccc !important; cursor: not-allowed; }
  </style>
</head>
<body>

<div id="game-container">
  <header>
    <div class="header-info">
      <div id="room-info">캐치 드로잉</div>
      <div id="room-code-badge" class="room-badge" style="display:none;">코드: <span id="header-code">-</span></div>
    </div>
    <button class="menu-btn" onclick="toggleMenu(true)">☰</button>
  </header>

  <div class="modal-overlay" id="menu-modal">
    <div class="modal-box">
      <h3>게임 메뉴</h3><br>
      <button class="btn btn-secondary" onclick="toggleMenu(false)">계속하기</button>
      <button class="btn btn-danger" onclick="leaveGame()">게임 나가기</button>
    </div>
  </div>

  <div class="modal-overlay" id="alert-modal">
    <div class="modal-box">
      <p id="alert-msg">알림 메시지</p><br>
      <button class="btn" onclick="closeAlert()">확인</button>
    </div>
  </div>

  <!-- 1. 로그인 스크린 -->
  <div class="screen active" id="login-screen">
    <div class="login-box">
      <h2 style="margin-bottom: 15px;">캐치 드로잉 시작하기</h2>
      <input type="text" id="nickname-input" placeholder="닉네임 입력 (최대 8자)" maxlength="8">
      
      <button class="btn btn-success" style="width: 100%; margin-top: 10px;" onclick="createRoom('SOLO')">혼자서 하기 (즉시 시작)</button>
      <button class="btn" style="width: 100%; margin-top: 8px;" id="create-btn" onclick="createRoom('MULTI')">새 방 만들기 (방 코드 생성)</button>
      
      <div class="divider"><span>또는 상대방 방에 참여하기</span></div>

      <div class="join-code-group">
        <input type="text" id="join-code-input" placeholder="방 코드 6자리" maxlength="6" oninput="this.value = this.value.toUpperCase()">
        <button class="btn btn-warning" style="white-space: nowrap;" id="join-btn" onclick="joinByCode()">코드 입력 후 참여</button>
      </div>
    </div>
  </div>

  <!-- 2. 대기실 화면 -->
  <div class="screen" id="lobby-screen">
    <div class="lobby-layout">
      <div class="user-list-panel">
        <h3>참여자 (<span id="user-count">0</span>/8)</h3><br>
        <div id="lobby-user-list"></div>
      </div>
      <div class="lobby-main-panel">
        <div class="code-display-box">
          <div style="font-size:12px; color:#666; margin-bottom:5px;">같이 할 사람에게 코드를 알려주세요!</div>
          <span id="lobby-room-code">XXXXXX</span><br>
          <button class="btn btn-secondary" style="margin-top:10px; padding:4px 10px; font-size:12px;" onclick="copyRoomCode()">코드 복사</button>
        </div>
        <h3 id="ready-status-msg" style="margin-bottom: 20px; color: #e67e22;">버튼을 눌러 준비해주세요!</h3>
        <button class="btn" id="ready-btn" onclick="toggleReady()">준비 완료 / 시작</button>
      </div>
    </div>
  </div>

  <!-- 3. 게임 화면 -->
  <div class="screen" id="game-screen">
    <div class="game-layout">
      <div class="game-sidebar">
        <h3>제출 현황</h3><br>
        <div id="game-user-list"></div>
      </div>

      <div class="game-main">
        <div class="game-header">
          <div>라운드: <span id="current-round">1</span> / 5</div>
          <div>남은 시간: <span id="timer">30</span>초</div>
        </div>
        <div class="keyword">제시어: <span id="word-display">???</span></div>
        <canvas id="canvas" width="400" height="300"></canvas>
        <div class="controls">
          <button class="btn btn-secondary" id="clear-btn" onclick="clearCanvas()">전체 지우기</button>
          <button class="btn" id="submit-draw-btn" onclick="submitDrawing()">그림 제출 완료</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 4. 결과 화면 -->
  <div class="screen" id="result-screen">
    <h2 id="result-title">제출된 그림 목록</h2>
    <div class="gallery" id="gallery"></div>
  </div>
</div>

<script>
  // 지후님의 Firebase 설정 정보가 적용되었습니다.
  const firebaseConfig = {
    apiKey: "AIzaSyAtNrtS13po1dFnp2ghAUgl3oAFAiW_oRQ",
    authDomain: "catch-drawing-cd3ad.firebaseapp.com",
    databaseURL: "https://catch-drawing-cd3ad-default-rtdb.firebaseio.com",
    projectId: "catch-drawing-cd3ad",
    storageBucket: "catch-drawing-cd3ad.firebasestorage.app",
    messagingSenderId: "1050697457191",
    appId: "1:1050697457191:web:83f8577762c04a36b03802",
    measurementId: "G-HVFZ8LD7N6"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const DRAW_TIME = 30;
  const WORDS = ["강아지", "피자", "에펠탑", "고양이", "자동차", "우주선", "사과", "바나나", "로봇", "비행기", "눈사람"];

  let myId = 'u_' + Math.random().toString(36).substr(2, 5);
  let myName = '';
  let gameMode = 'MULTI';
  let currentRoomCode = '';

  let gameState = {
    roomCode: '',
    users: {},
    status: 'LOBBY',
    round: 1,
    word: '',
    timer: DRAW_TIME
  };

  function generateRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    return code;
  }

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function showAlert(msg) {
    document.getElementById('alert-msg').innerText = msg;
    document.getElementById('alert-modal').classList.add('active');
  }

  function closeAlert() { document.getElementById('alert-modal').classList.remove('active'); }
  function toggleMenu(show) { document.getElementById('menu-modal').classList.toggle('active', show); }

  function copyRoomCode() {
    if(!currentRoomCode) return;
    navigator.clipboard.writeText(currentRoomCode).then(() => showAlert('방 코드가 복사되었습니다: ' + currentRoomCode));
  }

  function updateUI() {
    const usersArr = Object.values(gameState.users || {});
    
    if (currentRoomCode && gameMode === 'MULTI') {
      document.getElementById('room-code-badge').style.display = 'block';
      document.getElementById('header-code').innerText = currentRoomCode;
      document.getElementById('lobby-room-code').innerText = currentRoomCode;
    }

    document.getElementById('user-count').innerText = usersArr.length;
    const lobbyList = document.getElementById('lobby-user-list');
    lobbyList.innerHTML = '';
    usersArr.forEach(u => {
      const div = document.createElement('div');
      div.className = 'user-item';
      const badge = u.ready ? `<span class="badge badge-ready">준비 완료</span>` : `<span class="badge badge-wait">대기 중</span>`;
      div.innerHTML = `<span>${u.name} ${u.id === myId ? '(나)' : ''}</span> ${badge}`;
      lobbyList.appendChild(div);
    });

    const gameUserList = document.getElementById('game-user-list');
    gameUserList.innerHTML = '';
    usersArr.forEach(u => {
      const div = document.createElement('div');
      div.className = 'user-item';
      const badge = u.submitted ? `<span class="badge badge-submitted">제출 완료</span>` : `<span class="badge badge-wait">그리는 중...</span>`;
      div.innerHTML = `<span>${u.name}</span> ${badge}`;
      gameUserList.appendChild(div);
    });

    document.getElementById('timer').innerText = gameState.timer;

    if (gameState.status === 'LOBBY') {
      if (myName) showScreen('lobby-screen');
    } else if (gameState.status === 'PLAYING') {
      showScreen('game-screen');
      document.getElementById('current-round').innerText = gameState.round;
      document.getElementById('word-display').innerText = gameState.word;
    } else if (gameState.status === 'ROUND_RESULT') {
      showScreen('result-screen');
      renderResultScreen();
    }
  }

  function listenToRoom(code) {
    db.ref('rooms/' + code).on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        gameState = data;
        updateUI();
      }
    });
  }

  function createRoom(selectedMode) {
    const input = document.getElementById('nickname-input');
    const name = input.value.trim();
    if (!name) return showAlert('닉네임을 입력해주세요.');

    myName = name;
    gameMode = selectedMode;

    if (gameMode === 'SOLO') {
      currentRoomCode = 'SOLO';
      gameState = {
        roomCode: 'SOLO',
        users: { [myId]: { id: myId, name: myName, ready: true, score: 0, drawing: '', submitted: false } },
        status: 'PLAYING', round: 1, word: WORDS[Math.floor(Math.random() * WORDS.length)], timer: DRAW_TIME
      };
      updateUI();
    } else {
      currentRoomCode = generateRoomCode();
      const initialUsers = {};
      initialUsers[myId] = { id: myId, name: myName, ready: false, score: 0, drawing: '', submitted: false };

      db.ref('rooms/' + currentRoomCode).set({
        roomCode: currentRoomCode,
        users: initialUsers,
        status: 'LOBBY',
        round: 1,
        word: WORDS[Math.floor(Math.random() * WORDS.length)],
        timer: DRAW_TIME
      }).then(() => {
        listenToRoom(currentRoomCode);
      });
    }
  }

  function joinByCode() {
    const nameInput = document.getElementById('nickname-input');
    const codeInput = document.getElementById('join-code-input');
    const name = nameInput.value.trim();
    const code = codeInput.value.trim().toUpperCase();

    if (!name) return showAlert('닉네임을 입력해주세요.');
    if (!code || code.length !== 6) return showAlert('6자리 방 코드를 입력하세요.');

    myName = name;
    gameMode = 'MULTI';
    currentRoomCode = code;

    db.ref('rooms/' + code).once('value', (snapshot) => {
      if (!snapshot.exists()) {
        showAlert('존재하지 않는 방 코드입니다.');
        return;
      }

      db.ref('rooms/' + code + '/users/' + myId).set({
        id: myId, name: myName, ready: false, score: 0, drawing: '', submitted: false
      }).then(() => {
        listenToRoom(code);
      });
    });
  }

  function toggleReady() {
    if (gameMode === 'SOLO') return;
    const currentReady = gameState.users[myId]?.ready || false;
    db.ref('rooms/' + currentRoomCode + '/users/' + myId + '/ready').set(!currentReady);

    setTimeout(() => {
      const usersArr = Object.values(gameState.users || {});
      if (usersArr.length > 0 && usersArr.every(u => u.ready)) {
        db.ref('rooms/' + currentRoomCode).update({
          status: 'PLAYING',
          timer: DRAW_TIME,
          word: WORDS[Math.floor(Math.random() * WORDS.length)]
        });
      }
    }, 500);
  }

  function leaveGame() { location.reload(); }

  // Canvas 로직
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;

  function initCanvas() {
    ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#000';
    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    });
    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
    });
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mouseleave', () => isDrawing = false);
  }

  function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

  function submitDrawing() {
    const dataUrl = canvas.toDataURL();
    if (gameMode === 'MULTI') {
      db.ref('rooms/' + currentRoomCode + '/users/' + myId).update({
        drawing: dataUrl, submitted: true
      });
      db.ref('rooms/' + currentRoomCode + '/status').set('ROUND_RESULT');
    } else {
      gameState.users[myId].drawing = dataUrl;
      gameState.users[myId].submitted = true;
      gameState.status = 'ROUND_RESULT';
      updateUI();
    }
  }

  function renderResultScreen() {
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';
    Object.values(gameState.users || {}).forEach(u => {
      if (u.drawing) {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.innerHTML = `<img src="${u.drawing}"><div><b>${u.name}</b></div>`;
        gallery.appendChild(item);
      }
    });
  }

  window.onload = () => { initCanvas(); };
</script>
</body>
</html>
