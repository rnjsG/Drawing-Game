<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>캐치 드로잉 게임</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    #game-container { width: 95%; max-width: 900px; height: 90vh; max-height: 800px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); position: relative; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #4a90e2; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header-info { display: flex; align-items: center; gap: 10px; }
    .room-badge { background: rgba(255, 255, 255, 0.2); padding: 4px 8px; border-radius: 4px; font-size: 14px; font-weight: bold; }
    .menu-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
    .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box { background: white; padding: 25px; border-radius: 8px; text-align: center; width: 80%; max-width: 320px; }
    .modal-box button { margin: 8px; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-secondary { background: #95a5a6; color: white; }
    .btn-warning { background: #f39c12; color: white; }
    .btn-success { background: #2ecc71; color: white; }
    .screen { display: none; flex: 1; flex-direction: column; padding: 20px; align-items: center; justify-content: center; width: 100%; overflow-y: auto; }
    .screen.active { display: flex; }
    .login-box { text-align: center; width: 100%; max-width: 380px; }
    .login-box input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center; }
    .login-box input#join-code-input { text-transform: uppercase; }
    .divider { margin: 15px 0; border-bottom: 1px solid #ddd; position: relative; }
    .divider span { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: white; padding: 0 10px; color: #888; font-size: 12px; }
    .join-code-group { display: flex; gap: 8px; margin-top: 8px; }
    .lobby-layout { display: flex; width: 100%; height: 100%; gap: 20px; }
    .user-list-panel { width: 35%; border-right: 1px solid #eee; padding-right: 15px; overflow-y: auto; }
    .lobby-main-panel { width: 65%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .code-display-box { background: #eef5fc; border: 2px dashed #4a90e2; padding: 15px; border-radius: 8px; margin-bottom: 20px; width: 100%; max-width: 300px; }
    .code-display-box span { font-size: 24px; font-weight: bold; color: #4a90e2; letter-spacing: 2px; }
    .user-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f8f9fa; border-radius: 6px; margin-bottom: 8px; }
    .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; color: white; font-weight: bold; }
    .badge-ready { background: #2ecc71; }
    .badge-wait { background: #e67e22; }
    .badge-submitted { background: #3498db; }
    .game-layout { display: flex; width: 100%; height: 100%; gap: 15px; }
    .game-sidebar { width: 30%; border-right: 1px solid #eee; padding-right: 10px; }
    .game-main { width: 70%; display: flex; flex-direction: column; align-items: center; }
    .game-header { display: flex; justify-content: space-between; width: 100%; margin-bottom: 10px; font-weight: bold; font-size: 18px; }
    .keyword { font-size: 22px; color: #e74c3c; margin-bottom: 10px; font-weight: bold; }
    #canvas { border: 2px solid #333; border-radius: 8px; background: white; cursor: crosshair; touch-action: none; }
    .controls { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    @keyframes pulse-red { 0% { color: #e74c3c; transform: scale(1); opacity: 1; } 50% { color: #ff0000; transform: scale(1.3); opacity: 0.4; } 100% { color: #e74c3c; transform: scale(1); opacity: 1; } }
    .timer-warning { animation: pulse-red 0.5s infinite; font-weight: 900 !important; display: inline-block; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; width: 100%; margin-top: 15px; }
    .gallery-item { border: 1px solid #ccc; border-radius: 8px; padding: 12px; text-align: center; background: #fff; position: relative; }
    .gallery-item img { width: 100%; height: 130px; object-fit: contain; border: 1px solid #eee; border-radius: 4px; }
    .vote-bar-container { width: 100%; background: #eee; height: 16px; border-radius: 8px; margin-top: 8px; overflow: hidden; position: relative; }
    .vote-bar { height: 100%; background: #4a90e2; width: 0%; transition: width 0.6s ease-in-out; }
    .vote-count-text { font-size: 12px; margin-top: 3px; font-weight: bold; color: #555; }
    .next-round-panel { margin-top: 20px; text-align: center; width: 100%; padding: 15px; background: #f8f9fa; border-radius: 8px; }
    .next-ready-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 10px; }
    .btn { padding: 10px 15px; border: none; background: #4a90e2; color: white; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; }
    .btn:disabled { background: #ccc !important; cursor: not-allowed; }
  </style>
</head>
<body>

<div id="game-container">
  <header>
    <div class="header-info">
      <div id="room-info">캐치 드로잉</div>
      <div id="room-code-badge" class="room-badge" style="display:none;">코드: <span id="header-code">-</span></div>
    </div>
    <button class="menu-btn" onclick="toggleMenu(true)">☰</button>
  </header>

  <div class="modal-overlay" id="menu-modal">
    <div class="modal-box">
      <h3>게임 메뉴</h3><br>
      <button class="btn btn-secondary" onclick="toggleMenu(false)">계속하기</button>
      <button class="btn btn-danger" onclick="leaveGame()">게임 나가기</button>
    </div>
  </div>

  <div class="modal-overlay" id="alert-modal">
    <div class="modal-box">
      <p id="alert-msg">알림 메시지</p><br>
      <button class="btn" onclick="closeAlert()">확인</button>
    </div>
  </div>

  <!-- 1. 로그인 스크린 -->
  <div class="screen active" id="login-screen">
    <div class="login-box">
      <h2 style="margin-bottom: 15px;">캐치 드로잉 시작하기</h2>
      <input type="text" id="nickname-input" placeholder="닉네임 입력 (최대 8자)" maxlength="8">
      
      <button class="btn btn-success" style="width: 100%; margin-top: 10px;" onclick="createRoom('SOLO')">혼자서 하기 (즉시 시작)</button>
      <button class="btn" style="width: 100%; margin-top: 8px;" id="create-btn" onclick="createRoom('MULTI')">새 방 만들기 (방 코드 생성)</button>
      
      <div class="divider"><span>또는 상대방 방에 참여하기</span></div>

      <div class="join-code-group">
        <input type="text" id="join-code-input" placeholder="방 코드 6자리" maxlength="6" oninput="this.value = this.value.toUpperCase()">
        <button class="btn btn-warning" style="white-space: nowrap;" id="join-btn" onclick="joinByCode()">방 코드 입력 후 참여</button>
      </div>
    </div>
  </div>

  <!-- 2. 대기실 화면 -->
  <div class="screen" id="lobby-screen">
    <div class="lobby-layout">
      <div class="user-list-panel">
        <h3>참여자 (<span id="user-count">0</span>/8)</h3><br>
        <div id="lobby-user-list"></div>
      </div>
      <div class="lobby-main-panel">
        <div class="code-display-box">
          <div style="font-size:12px; color:#666; margin-bottom:5px;">같이 할 사람에게 코드를 알려주세요!</div>
          <span id="lobby-room-code">XXXXXX</span><br>
          <button class="btn btn-secondary" style="margin-top:10px; padding:4px 10px; font-size:12px;" onclick="copyRoomCode()">코드 복사</button>
        </div>
        <h3 id="ready-status-msg" style="margin-bottom: 20px; color: #e67e22;">버튼을 눌러 준비해주세요!</h3>
        <button class="btn" id="ready-btn" onclick="toggleReady()">게임 시작 / 준비 완료</button>
      </div>
    </div>
  </div>

  <!-- 3. 게임 화면 -->
  <div class="screen" id="game-screen">
    <div class="game-layout">
      <div class="game-sidebar">
        <h3>제출 현황</h3><br>
        <div id="game-user-list"></div>
      </div>

      <div class="game-main">
        <div class="game-header">
          <div>라운드: <span id="current-round">1</span> / 5</div>
          <div>남은 시간: <span id="timer">30</span>초</div>
        </div>
        <div class="keyword">제시어: <span id="word-display">???</span></div>
        <canvas id="canvas" width="400" height="300"></canvas>
        <div class="controls">
          <button class="btn btn-secondary" id="undo-btn" onclick="undoDraw()">↩ 실행 취소</button>
          <button class="btn btn-secondary" id="redo-btn" onclick="redoDraw()">↪ 다시 실행</button>
          <button class="btn btn-secondary" id="clear-btn" onclick="clearCanvas()">전체 지우기</button>
          <button class="btn" id="submit-draw-btn" onclick="submitDrawing()">그림 완료</button>
          <button class="btn btn-warning" id="cancel-draw-btn" onclick="cancelSubmission()" style="display: none;">제출 취소 및 수정</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 4. 결과 화면 -->
  <div class="screen" id="result-screen">
    <h2 id="result-title">그림을 보고 투표해주세요!</h2>
    <div class="gallery" id="gallery"></div>
    
    <div class="next-round-panel">
      <button class="btn btn-success" id="next-round-btn" onclick="toggleNextRoundReady()">다음 라운드로 넘어가기</button>
      <div class="next-ready-list" id="next-ready-status" style="display: none;"></div>
    </div>

    <div style="margin-top:20px;" id="scoreboard"></div>
  </div>
</div>

<script>
  const TOTAL_ROUNDS = 5;
  const DRAW_TIME = 30;
  const WORDS = ["강아지", "피자", "에펠탑", "자는 모습", "오늘 풍경", "고양이", "자동차", "우주선", "사과", "바나나", "로봇", "비행기", "선글라스", "눈사람"];

  let myId = 'u_' + Math.random().toString(36).substr(2, 5);
  let myName = '';
  let gameMode = 'MULTI'; 
  let currentRoomCode = '';
  let isSubmitted = false;

  let broadcastChannel = null;

  let gameState = {
    roomCode: '',
    mode: 'MULTI',
    users: [], 
    status: 'LOBBY', 
    round: 1,
    word: '',
    timer: DRAW_TIME
  };

  function generateRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 6; i++) {
      code += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return code;
  }

  function isHost() {
    return gameMode === 'SOLO' || (gameState.users.length > 0 && gameState.users[0].id === myId);
  }

  // 브라우저 동기화 연결 (로딩 전혀 없이 0.01초 접속)
  function connectChannel(roomCode) {
    if (broadcastChannel) broadcastChannel.close();
    broadcastChannel = new BroadcastChannel('catch_drawing_' + roomCode);

    broadcastChannel.onmessage = (e) => {
      handleIncomingData(e.data);
    };
  }

  function broadcastState() {
    updateUI();
    if (isHost() && gameMode === 'MULTI' && broadcastChannel) {
      broadcastChannel.postMessage({ type: 'SYNC_STATE', payload: gameState });
    }
  }

  function handleIncomingData(data) {
    const { type, payload } = data;

    if (type === 'JOIN_REQ') {
      if (isHost()) {
        const exists = gameState.users.find(u => u.id === payload.id);
        if (!exists) gameState.users.push(payload);
        broadcastState();
      }
    } else if (type === 'ACTION_UPDATE') {
      if (isHost()) {
        const user = gameState.users.find(u => u.id === payload.id);
        if (user) {
          Object.assign(user, payload.data);
          broadcastState();
          if (gameState.status === 'LOBBY') checkAllReady();
          if (gameState.status === 'PLAYING') checkAllSubmitted();
          if (gameState.status === 'VOTING') checkAllVoted();
          if (gameState.status === 'ROUND_RESULT') checkAllNextRoundReady();
        }
      }
    } else if (type === 'SYNC_STATE') {
      gameState = payload;
      updateUI();
    }
  }

  function sendToHost(actionData) {
    if (isHost()) {
      const user = gameState.users.find(u => u.id === myId);
      if (user) Object.assign(user, actionData);
      broadcastState();
      if (gameState.status === 'LOBBY') checkAllReady();
      if (gameState.status === 'PLAYING') checkAllSubmitted();
      if (gameState.status === 'VOTING') checkAllVoted();
      if (gameState.status === 'ROUND_RESULT') checkAllNextRoundReady();
    } else if (broadcastChannel) {
      broadcastChannel.postMessage({
        type: 'ACTION_UPDATE',
        payload: { id: myId, data: actionData }
      });
    }
  }

  // --- 화면 및 UI 제어 ---
  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function showAlert(msg) {
    document.getElementById('alert-msg').innerText = msg;
    document.getElementById('alert-modal').classList.add('active');
  }

  function closeAlert() {
    document.getElementById('alert-modal').classList.remove('active');
  }

  function toggleMenu(show) {
    document.getElementById('menu-modal').classList.toggle('active', show);
  }

  function copyRoomCode() {
    navigator.clipboard.writeText(currentRoomCode).then(() => showAlert('방 코드가 복사되었습니다: ' + currentRoomCode));
  }

  function updateUI() {
    const me = gameState.users.find(u => u.id === myId);
    if (currentRoomCode && gameMode === 'MULTI') {
      document.getElementById('room-code-badge').style.display = 'block';
      document.getElementById('header-code').innerText = currentRoomCode;
      document.getElementById('lobby-room-code').innerText = currentRoomCode;
    } else {
      document.getElementById('room-code-badge').style.display = 'none';
    }

    document.getElementById('user-count').innerText = gameState.users.length;
    const lobbyList = document.getElementById('lobby-user-list');
    lobbyList.innerHTML = '';
    gameState.users.forEach(u => {
      const div = document.createElement('div');
      div.className = 'user-item';
      const badge = u.ready ? `<span class="badge badge-ready">준비 완료</span>` : `<span class="badge badge-wait">대기 중</span>`;
      div.innerHTML = `<span>${u.name} ${u.id === myId ? '(나)' : ''}</span> ${badge}`;
      lobbyList.appendChild(div);
    });

    if (me && gameState.status === 'LOBBY') {
      document.getElementById('ready-status-msg').innerText = me.ready ? "다른 플레이어를 기다리는 중입니다..." : "버튼을 눌러 준비 완료해주세요!";
    }

    const gameUserList = document.getElementById('game-user-list');
    gameUserList.innerHTML = '';
    gameState.users.forEach(u => {
      const div = document.createElement('div');
      div.className = 'user-item';
      const badge = u.submitted ? `<span class="badge badge-submitted">제출 완료</span>` : `<span class="badge badge-wait">그리는 중...</span>`;
      div.innerHTML = `<span>${u.name}</span> ${badge}`;
      gameUserList.appendChild(div);
    });

    const timerElem = document.getElementById('timer');
    timerElem.innerText = gameState.timer;
    if (gameState.timer <= 5 && gameState.status === 'PLAYING') timerElem.classList.add('timer-warning');
    else timerElem.classList.remove('timer-warning');

    if (gameState.status === 'LOBBY') {
      if (myName) showScreen('lobby-screen');
    } else if (gameState.status === 'PLAYING') {
      showScreen('game-screen');
      document.getElementById('current-round').innerText = gameState.round;
      document.getElementById('word-display').innerText = gameState.word;
    } else if (gameState.status === 'VOTING' || gameState.status === 'ROUND_RESULT' || gameState.status === 'GAME_OVER') {
      showScreen('result-screen');
      renderResultScreen();
    }

    updateUndoRedoBtnState();
  }

  // --- 방 생성 및 입장 ---
  function createRoom(selectedMode) {
    const input = document.getElementById('nickname-input');
    const name = input.value.trim();
    if (!name) return showAlert('닉네임을 입력해주세요.');

    myName = name;
    gameMode = selectedMode;
    gameState.mode = selectedMode;

    if (gameMode === 'SOLO') {
      document.getElementById('room-info').innerText = '캐치 드로잉 (솔로)';
      gameState.users = [{ id: myId, name: myName, ready: true, score: 0, drawing: null, submitted: false, votedFor: null, nextRoundReady: false }];
      startNewRound(1);
    } else {
      currentRoomCode = generateRoomCode();
      connectChannel(currentRoomCode);

      document.getElementById('room-info').innerText = '캐치 드로잉 (멀티)';
      gameState.roomCode = currentRoomCode;
      gameState.users = [{ id: myId, name: myName, ready: false, score: 0, drawing: null, submitted: false, votedFor: null, nextRoundReady: false }];
      broadcastState();
      showScreen('lobby-screen');
    }
  }

  function joinByCode() {
    const nameInput = document.getElementById('nickname-input');
    const codeInput = document.getElementById('join-code-input');
    const name = nameInput.value.trim();
    const code = codeInput.value.trim().toUpperCase();

    if (!name) return showAlert('닉네임을 입력해주세요.');
    if (!code || code.length !== 6) return showAlert('올바른 6자리 방 코드를 입력해주세요.');

    myName = name;
    gameMode = 'MULTI';
    currentRoomCode = code;

    connectChannel(code);

    document.getElementById('room-info').innerText = '캐치 드로잉 (멀티)';
    const meUser = { id: myId, name: myName, ready: false, score: 0, drawing: null, submitted: false, votedFor: null, nextRoundReady: false };
    
    // 즉시 방장에게 참가 전송
    broadcastChannel.postMessage({ type: 'JOIN_REQ', payload: meUser });
    showScreen('lobby-screen');
  }

  function toggleReady() {
    const me = gameState.users.find(u => u.id === myId);
    if (me) sendToHost({ ready: !me.ready });
  }

  function checkAllReady() {
    if (!isHost()) return;
    const allReady = gameState.users.length > 0 && gameState.users.every(u => u.ready);
    if (allReady) startNewRound(1);
  }

  function leaveGame() { location.reload(); }

  // --- 라운드 진행 ---
  let timerInterval = null;
  function startNewRound(roundNum) {
    gameState.status = 'PLAYING';
    gameState.round = roundNum;
    gameState.timer = DRAW_TIME;
    gameState.word = WORDS[Math.floor(Math.random() * WORDS.length)];
    gameState.users.forEach(u => { u.drawing = null; u.submitted = false; u.votedFor = null; u.nextRoundReady = false; });
    resetCanvasAndHistory();
    setSubmitUI(false);
    broadcastState();
    startTimer();
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    if (isHost()) {
      timerInterval = setInterval(() => {
        gameState.timer--;
        if (gameState.timer <= 0) {
          clearInterval(timerInterval);
          finishDrawingPhase();
        } else {
          broadcastState();
        }
      }, 1000);
    }
  }

  function finishDrawingPhase() {
    if (timerInterval) clearInterval(timerInterval);
    const me = gameState.users.find(u => u.id === myId);
    if (me && !me.submitted) {
      me.drawing = canvas.toDataURL();
      me.submitted = true;
    }
    gameState.status = (gameMode === 'SOLO') ? 'ROUND_RESULT' : 'VOTING';
    broadcastState();
  }

  // --- 캔버스 구현 ---
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;
  let undoStack = [];
  let redoStack = [];

  function initCanvas() {
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#000';
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseleave', stopDraw);
    canvas.addEventListener('touchstart', (e) => { startDraw(getTouchPos(e)); e.preventDefault(); });
    canvas.addEventListener('touchmove', (e) => { draw(getTouchPos(e)); e.preventDefault(); });
    canvas.addEventListener('touchend', stopDraw);
  }

  function getTouchPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { clientX: e.touches[0].clientX - rect.left, clientY: e.touches[0].clientY - rect.top, isTouch: true };
  }

  function saveCanvasState() {
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    redoStack = []; 
    updateUndoRedoBtnState();
  }

  function resetCanvasAndHistory() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    undoStack = [];
    redoStack = [];
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    updateUndoRedoBtnState();
  }

  function startDraw(e) {
    if (isSubmitted) return;
    isDrawing = true;
    ctx.beginPath();
    const x = e.isTouch ? e.clientX : e.offsetX;
    const y = e.isTouch ? e.clientY : e.offsetY;
    ctx.moveTo(x, y);
  }

  function draw(e) {
    if (!isDrawing || isSubmitted) return;
    const x = e.isTouch ? e.clientX : e.offsetX;
    const y = e.isTouch ? e.clientY : e.offsetY;
    ctx.lineTo(x, y);
    ctx.stroke();
  }

  function stopDraw() {
    if (isDrawing) {
      isDrawing = false;
      saveCanvasState();
    }
  }

  function undoDraw() {
    if (isSubmitted || undoStack.length <= 1) return;
    redoStack.push(undoStack.pop());
    ctx.putImageData(undoStack[undoStack.length - 1], 0, 0);
    updateUndoRedoBtnState();
  }

  function redoDraw() {
    if (isSubmitted || redoStack.length === 0) return;
    const nextState = redoStack.pop();
    undoStack.push(nextState);
    ctx.putImageData(nextState, 0, 0);
    updateUndoRedoBtnState();
  }

  function clearCanvas() {
    if (isSubmitted) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    saveCanvasState();
  }

  function updateUndoRedoBtnState() {
    const undoBtn = document.getElementById('undo-btn');
    const redoBtn = document.getElementById('redo-btn');
    const clearBtn = document.getElementById('clear-btn');
    if (undoBtn && redoBtn && clearBtn) {
      undoBtn.disabled = isSubmitted || undoStack.length <= 1;
      redoBtn.disabled = isSubmitted || redoStack.length === 0;
      clearBtn.disabled = isSubmitted;
    }
  }

  function setSubmitUI(submitted) {
    isSubmitted = submitted;
    document.getElementById('submit-draw-btn').style.display = submitted ? 'none' : 'inline-block';
    document.getElementById('cancel-draw-btn').style.display = submitted ? 'inline-block' : 'none';
    updateUndoRedoBtnState();
  }

  function submitDrawing() {
    setSubmitUI(true);
    sendToHost({ drawing: canvas.toDataURL(), submitted: true });
  }

  function cancelSubmission() {
    setSubmitUI(false);
    sendToHost({ submitted: false });
  }

  function checkAllSubmitted() {
    if (!isHost()) return;
    if (gameState.users.every(u => u.submitted)) finishDrawingPhase();
  }

  // --- 결과 및 투표 ---
  function renderResultScreen() {
    const gallery = document.getElementById('gallery');
    const title = document.getElementById('result-title');
    const scoreboard = document.getElementById('scoreboard');
    const nextBtn = document.getElementById('next-round-btn');
    const nextStatusPanel = document.getElementById('next-ready-status');
    gallery.innerHTML = '';

    const me = gameState.users.find(u => u.id === myId);
    const votes = {};
    let totalVotes = 0;
    gameState.users.forEach(u => votes[u.id] = 0);
    gameState.users.forEach(u => {
      if (u.votedFor && votes[u.votedFor] !== undefined) {
        votes[u.votedFor]++;
        totalVotes++;
      }
    });

    if (gameMode === 'SOLO') title.innerText = `제시어 [${gameState.word}] - 내가 그린 그림`;
    else if (gameState.status === 'VOTING') title.innerText = `제시어 [${gameState.word}] - 그림에 투표해 주세요!`;
    else if (gameState.status === 'ROUND_RESULT') title.innerText = `라운드 ${gameState.round} 결과 발표!`;
    else title.innerText = `🏆 최종 게임 종료 🏆`;

    gameState.users.forEach(u => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      const img = document.createElement('img');
      img.src = u.drawing || 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
      const nameTag = document.createElement('div');
      nameTag.style.fontWeight = 'bold';
      nameTag.style.margin = '5px 0';
      nameTag.innerText = u.name;

      item.appendChild(img);
      item.appendChild(nameTag);

      if (gameMode === 'MULTI') {
        if (gameState.status === 'VOTING') {
          const voteBtn = document.createElement('button');
          voteBtn.className = 'btn';
          voteBtn.style.padding = '5px 10px';
          voteBtn.style.fontSize = '12px';
          voteBtn.innerText = '투표하기';
          if (u.id === myId) { voteBtn.disabled = true; voteBtn.innerText = '본인 그림'; }
          else if (me && me.votedFor) {
            voteBtn.disabled = true;
            if (me.votedFor === u.id) voteBtn.innerText = '투표함!';
          }
          voteBtn.onclick = () => castVote(u.id);
          item.appendChild(voteBtn);
        } else if (gameState.status === 'ROUND_RESULT' || gameState.status === 'GAME_OVER') {
          const vCount = votes[u.id] || 0;
          const percent = totalVotes > 0 ? (vCount / totalVotes) * 100 : 0;
          const barContainer = document.createElement('div');
          barContainer.className = 'vote-bar-container';
          const bar = document.createElement('div');
          bar.className = 'vote-bar';
          setTimeout(() => { bar.style.width = percent + '%'; }, 100);
          const countText = document.createElement('div');
          countText.className = 'vote-count-text';
          countText.innerText = `${vCount}표 (${Math.round(percent)}%)`;
          barContainer.appendChild(bar);
          item.appendChild(barContainer);
          item.appendChild(countText);
        }
      }
      gallery.appendChild(item);
    });

    if (gameState.status === 'VOTING') {
      nextBtn.style.display = 'none';
      nextStatusPanel.style.display = 'none';
    } else {
      nextBtn.style.display = 'inline-block';
      nextBtn.innerText = me && me.nextRoundReady 
        ? (gameState.round >= TOTAL_ROUNDS ? "게임 종료 대기 중..." : "다음 라운드 대기 중...") 
        : (gameState.round >= TOTAL_ROUNDS ? "최종 결과 확인 완료" : "다음 라운드로 넘어가기");
      
      if (gameMode === 'MULTI') {
        nextStatusPanel.style.display = 'flex';
        nextStatusPanel.innerHTML = gameState.users.map(u => {
          const badge = u.nextRoundReady ? `<span class="badge badge-ready">완료</span>` : `<span class="badge badge-wait">대기</span>`;
          return `<div class="user-item" style="padding:4px 8px;"><span>${u.name}</span>&nbsp;${badge}</div>`;
        }).join('');
      } else {
        nextStatusPanel.style.display = 'none';
      }
    }

    scoreboard.innerHTML = '<h3>현재 스코어</h3>' + gameState.users.map(u => `<div>${u.name}: ${u.score}점</div>`).join('');
  }

  function castVote(targetId) {
    const me = gameState.users.find(u => u.id === myId);
    if (me && !me.votedFor) sendToHost({ votedFor: targetId });
  }

  function checkAllVoted() {
    if (!isHost()) return;
    if (gameState.users.every(u => u.votedFor !== null)) calculateScores();
  }

  function calculateScores() {
    const votes = {};
    gameState.users.forEach(u => votes[u.id] = 0);
    gameState.users.forEach(u => {
      if (u.votedFor && votes[u.votedFor] !== undefined) votes[u.votedFor]++;
    });

    const sorted = [...gameState.users].sort((a, b) => votes[b.id] - votes[a.id]);
    if (gameState.users.length <= 3) {
      if (sorted.length > 0 && votes[sorted[0].id] > 0) {
        const winner = gameState.users.find(u => u.id === sorted[0].id);
        if (winner) winner.score += 1;
      }
    } else {
      if (sorted.length > 0 && votes[sorted[0].id] > 0) {
        const first = gameState.users.find(u => u.id === sorted[0].id);
        if (first) first.score += 2;
      }
      if (sorted.length > 1 && votes[sorted[1].id] > 0) {
        const second = gameState.users.find(u => u.id === sorted[1].id);
        if (second) second.score += 1;
      }
    }
    gameState.status = 'ROUND_RESULT';
    broadcastState();
  }

  function toggleNextRoundReady() {
    const me = gameState.users.find(u => u.id === myId);
    if (me) sendToHost({ nextRoundReady: !me.nextRoundReady });
  }

  function checkAllNextRoundReady() {
    if (!isHost()) return;
    if (gameState.users.every(u => u.nextRoundReady)) {
      if (gameState.round < TOTAL_ROUNDS) startNewRound(gameState.round + 1);
      else {
        gameState.status = 'GAME_OVER';
        broadcastState();
      }
    }
  }

  window.onload = () => { initCanvas(); };
</script>
</body>
</html>
