<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이상형 월드컵 / 게임 시스템</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }

    /* 상단 라운드 표시 UI */
    #round-indicator {
      position: absolute;
      top: 15px;
      left: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      background-color: #333;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* 메시지 및 상태 표시 */
    #message-box {
      font-size: 1.1rem;
      font-weight: bold;
      color: #d9534f;
      height: 30px;
      margin-top: 10px;
    }

    .container {
      max-width: 600px;
      margin: 50px auto 0;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .btn {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      background-color: #007bff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.3s;
    }

    .btn:hover {
      background-color: #0056b3;
    }

    .btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .voting-area {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
    }

    .vote-card {
      width: 40%;
      padding: 20px;
      border: 2px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .vote-card:hover {
      border-color: #007bff;
    }
  </style>
</head>
<body>

  <!-- 1. 상단 라운드 표시 -->
  <div id="round-indicator">라운드 1</div>

  <div class="container">
    <h2 id="title">라운드 진행 중</h2>
    
    <!-- 투표 영역 -->
    <div id="voting-area" class="voting-area">
      <div class="vote-card" onclick="castVote(1)">후보 A</div>
      <div class="vote-card" onclick="castVote(2)">후보 B</div>
    </div>

    <!-- 메시지 출력 영역 -->
    <div id="message-box"></div>

    <!-- 하단 액션 버튼 -->
    <button id="action-btn" class="btn" style="display: none;" onclick="handleNextStep()"></button>
  </div>

  <script>
    // 게임 상태 변수
    let currentRound = 1;
    const maxRounds = 3; // 총 라운드 수 (원하시는 라운드 수로 변경 가능)
    let isVoted = false;
    let startMessageTimer = null; // 메시지 중복 방지용 타이머 변수
    let isStarting = false;        // 중복 실행 방지 플래그

    // 초기화 및 라운드 UI 업데이트
    function updateRoundUI() {
      const roundIndicator = document.getElementById('round-indicator');
      roundIndicator.innerText = `[ 라운드 ${currentRound} ]`;
    }

    // 투표 실행 시
    function castVote(candidateId) {
      if (isVoted) return; // 이미 투표함
      isVoted = true;

      const messageBox = document.getElementById('message-box');
      const actionBtn = document.getElementById('action-btn');

      // 마지막 라운드 여부에 따른 버튼 텍스트 변경
      actionBtn.style.display = 'inline-block';
      if (currentRound >= maxRounds) {
        actionBtn.innerText = '최종 순위 보기';
      } else {
        actionBtn.innerText = '다음 라운드 준비 완료';
      }

      messageBox.innerText = `후보 ${candidateId}에 투표했습니다!`;
    }

    // 다음 단계 버튼 클릭 처리
    function handleNextStep() {
      if (currentRound >= maxRounds) {
        showFinalRankings();
      } else {
        prepareNextRound();
      }
    }

    // 다음 라운드 준비 및 전환 (중복 메시지 방지 로직 적용)
    function prepareNextRound() {
      const messageBox = document.getElementById('message-box');
      const actionBtn = document.getElementById('action-btn');
      
      actionBtn.style.display = 'none';

      // 3. 중복 메시지 및 타이머 실행 방지 처리
      if (isStarting) return;
      isStarting = true;

      // 이전 타이머가 남아있다면 제거
      if (startMessageTimer) {
        clearTimeout(startMessageTimer);
      }

      messageBox.innerText = '잠시 후 게임이 시작됩니다...';

      startMessageTimer = setTimeout(() => {
        currentRound++;
        isVoted = false;
        isStarting = false; // 플래그 해제
        messageBox.innerText = '';
        
        updateRoundUI(); // 라운드 표시 업데이트
      }, 2000); // 2초 후 다음 라운드 시작
    }

    // 최종 순위 보기
    function showFinalRankings() {
      document.getElementById('voting-area').style.display = 'none';
      document.getElementById('action-btn').style.display = 'none';
      document.getElementById('message-box').innerText = '';
      document.getElementById('title').innerText = '🏆 최종 순위 발표 🏆';
      document.getElementById('round-indicator').innerText = '[ 게임 종료 ]';
    }

    // 초기 실행
    updateRoundUI();
  </script>
</body>
</html>
